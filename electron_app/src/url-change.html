<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Change API URL</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 20px;
      color: #333;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-bottom: 20px;
    }
    input {
      width: 300px;
      padding: 10px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #45a049;
    }
    #error {
      color: red;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Change API URL</h2>
    <input type="text" id="apiUrl" placeholder="Enter API URL (e.g., http://localhost:8000/docs)">
    <button id="submitBtn">Change URL</button>
    <p id="error"></p>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const submitBtn = document.getElementById('submitBtn');
      const apiUrlInput = document.getElementById('apiUrl');
      const errorElement = document.getElementById('error');

      submitBtn.addEventListener('click', () => {
        const url = apiUrlInput.value.trim();

        if (!url) {
          errorElement.textContent = 'Please enter a URL.';
          return;
        }

        // Simple URL validation
        try {
          new URL(url);
          window.electronAPI.changeApiUrl(url);
          window.close();
        } catch (e) {
          errorElement.textContent = 'Please enter a valid URL.';
        }
      });

      // Allow pressing Enter key to submit
      apiUrlInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          submitBtn.click();
        }
      });
    });
  </script>
</body>
</html>
