name: 'Build Electron macOS Universal DMG'
description: 'Builds a universal macOS DMG file for both Intel and Apple Silicon Macs'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '18'
  electron-app-path:
    description: 'Path to the electron app directory'
    required: false
    default: 'electron_app'
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'macos-universal-dmg'
  mac-certs:
    description: 'Base64-encoded Apple certificates'
    required: false
    default: ''
  mac-certs-password:
    description: 'Password for the Apple certificates'
    required: false
    default: ''
  apple-id:
    description: 'Apple ID to use for notarization'
    required: false
    default: ''
  apple-id-password:
    description: 'App-specific password for the Apple ID'
    required: false
    default: ''
  team-id:
    description: 'Apple Developer Team ID'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.electron-app-path }}/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Installing dependencies in ${{ inputs.electron-app-path }}..."
        npm ci || npm install

    # Create temporary electron-builder config for universal build
    - name: Configure for universal build
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Creating electron-builder config for universal build..."
        # Create a temporary electron-builder.yml file
        cat > electron-builder.yml << EOL
        appId: com.mgraph.app
        productName: MGraph App
        mac:
          category: public.app-category.developer-tools
          target: dmg
          arch:
            - x64
            - arm64
          artifactName: "\${productName}-\${version}-universal.\${ext}"
        dmg:
          artifactName: "\${productName}-\${version}-universal.\${ext}"
        EOL
        
        # Show the created config
        echo "Created electron-builder.yml:"
        cat electron-builder.yml

    # Setup code signing if certificates are provided
    - name: Setup macOS code signing
      if: inputs.mac-certs != '' && inputs.mac-certs-password != ''
      shell: bash
      run: |
        echo "Setting up code signing..."
        # Create a temporary keychain
        KEY_CHAIN=build.keychain
        KEY_CHAIN_PASSWORD=temporary_password
        
        # Create a new keychain
        security create-keychain -p "$KEY_CHAIN_PASSWORD" "$KEY_CHAIN"
        security default-keychain -s "$KEY_CHAIN"
        security unlock-keychain -p "$KEY_CHAIN_PASSWORD" "$KEY_CHAIN"
        security set-keychain-settings -t 3600 -u "$KEY_CHAIN"
        
        # Import the certificates
        echo "${{ inputs.mac-certs }}" | base64 --decode > certificate.p12
        security import certificate.p12 -k "$KEY_CHAIN" -P "${{ inputs.mac-certs-password }}" -T "/usr/bin/codesign"
        
        # Set key partition list to allow access without UI prompt
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEY_CHAIN_PASSWORD" "$KEY_CHAIN"
        
        # Clean up
        rm certificate.p12

    - name: Configure notarization environment
      if: inputs.apple-id != '' && inputs.apple-id-password != '' && inputs.team-id != ''
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Setting up notarization environment..."
        # Create ENV variables for electron-builder
        echo "APPLE_ID=${{ inputs.apple-id }}" >> $GITHUB_ENV
        echo "APPLE_ID_PASSWORD=${{ inputs.apple-id-password }}" >> $GITHUB_ENV
        echo "APPLE_TEAM_ID=${{ inputs.team-id }}" >> $GITHUB_ENV

    - name: Build universal macOS app
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Building universal macOS app in ${{ inputs.electron-app-path }}..."
        # Set the electron-builder configuration overrides for a universal build
        export CSC_IDENTITY_AUTO_DISCOVERY=false
        # Run the build with the --universal flag
        npx electron-builder --mac --universal
        
        # Clean up temporary config
        if [ -f "electron-builder.yml" ]; then
          rm electron-builder.yml
        fi

    - name: List dist directory contents
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Listing dist directory contents:"
        find dist -type f -name "*.dmg" || echo "No DMG files found"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.electron-app-path }}/dist/*.dmg
        if-no-files-found: warn