name: 'Build Electron macOS DMG'
description: 'Builds a macOS DMG file for an Electron application'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '18'
  working-directory:
    description: 'Directory containing the package.json file'
    required: false
    default: '.'
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'macos-dmg'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Installing dependencies..."
        npm ci || npm install

    - name: Build macOS app
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Building macOS app..."
        npm run build

    - name: List dist directory contents
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "Listing dist directory contents:"
        ls -la dist
        ls -la dist/mac-arm64 || echo "mac-arm64 directory not found"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.working-directory }}/dist/*.dmg
          ${{ inputs.working-directory }}/dist/mac-arm64/*.dmg
        if-no-files-found: warn