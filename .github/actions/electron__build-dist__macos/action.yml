name: 'Build Electron macOS DMG'
description: 'Builds a macOS DMG file for an Electron application'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '18'
  electron-app-path:
    description: 'Path to the electron app directory'
    required: false
    default: 'electron_app'
  artifact-name:
    description: 'Name for the uploaded artifact'
    required: false
    default: 'macos-dmg'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: ${{ inputs.electron-app-path }}/package-lock.json

    - name: Check directory structure
      shell: bash
      run: |
        echo "Repository root:"
        ls -la
        echo "Electron app directory:"
        ls -la ${{ inputs.electron-app-path }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Installing dependencies in ${{ inputs.electron-app-path }}..."
        npm ci || npm install

    - name: Build macOS app
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Building macOS app in ${{ inputs.electron-app-path }}..."
        npm run build

    - name: List dist directory contents
      shell: bash
      working-directory: ${{ inputs.electron-app-path }}
      run: |
        echo "Listing dist directory contents:"
        ls -la dist || echo "dist directory not found"
        ls -la dist/mac-arm64 || echo "mac-arm64 directory not found"
        ls -la dist/mac || echo "mac directory not found"

    - name: Upload DMG artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.electron-app-path }}/dist/*.dmg
          ${{ inputs.electron-app-path }}/dist/mac-arm64/*.dmg
          ${{ inputs.electron-app-path }}/dist/mac/*.dmg
        if-no-files-found: warn